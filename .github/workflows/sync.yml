name: Sync ConnectCSE to Google Drive

on:
  schedule:
    # Runs every 5 hours (00:00, 05:00, 10:00, 15:00, 20:00 UTC)
    - cron: "0 */5 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync
        env:
          CONNECTCSE_EMAIL: ${{ secrets.CONNECTCSE_EMAIL }}
          CONNECTCSE_PASSWORD: ${{ secrets.CONNECTCSE_PASSWORD }}
          CONNECTCSE_BASE_URL: https://connectcse.ruet.ac.bd
          CONNECTCSE_POSTS_URL: https://connectcse.ruet.ac.bd/classposts/student
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python sync.py
